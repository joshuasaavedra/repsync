<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>REPSYNC – Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#F65100;--black:#151515;--gray:#777;--border:#eee;--light:#fafafa;--brand:'Anton',sans-serif;--display:'Bricolage Grotesque',sans-serif;--body:'Instrument Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--body);background:var(--light);color:var(--black)}.app{display:flex;min-height:100vh}.sidebar{width:245px;background:#fff;border-right:1px solid var(--border);padding:30px 22px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.logo{font:32px var(--brand);letter-spacing:.04em;color:var(--orange);text-decoration:none;margin-bottom:45px}.nav-label{font-size:11px;font-weight:700;color:#aaa;letter-spacing:.12em;margin-bottom:15px}.nav-menu{display:flex;flex-direction:column;gap:8px}.nav-item{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:9px;color:#777;font-size:14px;font-weight:600;text-decoration:none}.nav-item:hover,.nav-item.active{background:#FFF1E9;color:var(--orange)}.nav-icon{font-size:18px;width:22px;text-align:center}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:20px}.profile-mini{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;padding:6px}.avatar{width:40px;height:40px;border-radius:50%;background:#FFF1E9;color:var(--orange);display:grid;place-items:center;font-weight:800;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.profile-info strong{display:block;font-size:13px}.profile-info span{font-size:11px;color:#999}.logout{border:0;background:none;color:#777;padding:14px 0 0;font-size:13px;font-weight:600;cursor:pointer}.main{margin-left:245px;width:calc(100% - 245px);padding:42px 48px 70px;max-width:1050px}.mobile-head{display:none}.eyebrow{font-size:11px;letter-spacing:.13em;font-weight:700;color:var(--orange);text-transform:uppercase;margin-bottom:8px}.heading{font:40px var(--display);letter-spacing:-1.5px}.intro{color:var(--gray);font-size:14px;margin:5px 0 26px}.feed{max-width:720px}.post{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}.post-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}.post-head .avatar{width:44px;height:44px}.author{font-size:14px;font-weight:800}.author-link{color:inherit;text-decoration:none}.author-link:hover{color:var(--orange)}.handle{font-size:11px;color:#999;margin-top:3px}.date{margin-left:auto;font-size:11px;color:#999}.body{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 12px}.post-image{display:block;width:100%;max-height:620px;object-fit:contain;background:#fafafa;border-radius:11px;pointer-events:none;user-select:none}.post-actions,.fire-btn,.comment-toggle{position:relative;z-index:2;pointer-events:auto}.post-actions{display:flex;gap:10px;align-items:center;border-top:1px solid #f1f1f1;margin-top:14px;padding-top:12px}.fire-btn,.comment-toggle{border:1px solid #e8e8e8;background:#fff;border-radius:20px;padding:8px 13px;font:700 12px var(--body);color:#555;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.fire-btn.active{background:#fff1e9;border-color:#ffb995;color:#d94300}.fire-btn:disabled{opacity:.6;cursor:wait}.comment-toggle:hover,.fire-btn:hover{border-color:var(--orange);color:var(--orange)}.comment-count{color:#999;font-size:11px}.comments{display:none;margin-top:13px;border-top:1px solid #f1f1f1;padding-top:12px}.comments.open{display:block}.comment-list{display:grid;gap:10px;margin-bottom:12px}.comment{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}.comment .avatar{width:28px;height:28px;font-size:10px;flex-shrink:0}.comment strong{margin-right:5px}.comment-form{display:flex;gap:8px}.comment-form input{flex:1;min-width:0;border:1px solid #e5e5e5;border-radius:20px;padding:10px 13px;font:12px var(--body);outline:none}.comment-form input:focus{border-color:var(--orange)}.comment-form button{border:0;background:var(--orange);color:#fff;border-radius:20px;padding:0 14px;font-size:11px;font-weight:800;cursor:pointer}.comment-empty{font-size:11px;color:#aaa;padding:4px 0}.empty{padding:30px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;color:#999;font-size:13px}.error{color:#a33}.mobile-bottom-nav{display:none}@media(max-width:650px){.sidebar{display:none}.main{margin:0;width:100%;padding:22px 15px 135px}.mobile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.mobile-head .logo{font-size:27px;margin:0}.heading{font-size:33px}.post{padding:17px}.mobile-bottom-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,1fr);position:fixed;left:0;right:0;bottom:0;z-index:9999;min-height:104px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #e9e9e9;box-shadow:0 -5px 22px #00000014;gap:4px}.mobile-nav-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:4px 2px;border-radius:9px;color:#858585;text-decoration:none;font-size:10px;font-weight:700;text-align:center}.mobile-nav-icon{font-size:19px}.mobile-nav-link.active{color:var(--orange);background:#FFF1E9}body{padding-bottom:116px}}
</style></head><body><div class="app"><aside class="sidebar"><a href="dashboard.html" class="logo">REPSYNC</a><p class="nav-label">WORKSPACE</p><nav class="nav-menu"><a href="dashboard.html" class="nav-item"><span class="nav-icon">⌂</span>Dashboard</a><a href="nutrition.html" class="nav-item"><span class="nav-icon">◉</span>Nutrition</a><a href="workout-logs.html" class="nav-item"><span class="nav-icon">↗</span>Workout Logs</a><a href="muscle-targets.html" class="nav-item active"><span class="nav-icon">◎</span>Feed</a><a href="friends.html" class="nav-item"><span class="nav-icon">♧</span>Friends</a></nav><div class="sidebar-bottom"><a href="my-profile.html" class="profile-mini"><div class="avatar" id="sideAvatar">R</div><div class="profile-info"><strong id="sideName">Loading...</strong><span>View profile</span></div></a><button class="logout" id="logoutBtn">↪ Log out</button></div></aside><main class="main"><div class="mobile-head"><a href="dashboard.html" class="logo">REPSYNC</a><button class="logout" id="mobileLogout">Log out ↪</button></div><div class="eyebrow">YOUR FITNESS COMMUNITY</div><h1 class="heading">Feed</h1><p class="intro">Updates and progress shared by your REPSYNC community.</p><div class="feed" id="feed"><div class="empty">Loading posts…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="images/js/supabase.js"></script><script>
(()=>{
const db=window.supabaseClient,$=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,profiles=new Map();
function avatar(p){const initial=(p.full_name||p.username||'R').trim().charAt(0).toUpperCase();return `<div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initial)}</div>`}
async function load(){if(!db)throw new Error('Supabase did not initialize. Check images/js/supabase.js.');const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace('login.html');return}user=session.user;const {data:me}=await db.from('profiles').select('full_name,avatar_url').eq('id',user.id).maybeSingle();$('sideName').textContent=me?.full_name||user.email?.split('@')[0]||'Athlete';$('sideAvatar').innerHTML=me?.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:esc(($('sideName').textContent||'R').charAt(0).toUpperCase());await loadPosts();$('logoutBtn').addEventListener('click',logout);$('mobileLogout').addEventListener('click',logout);$('feed').addEventListener('click',handleFeedClick,true);db.channel('repsync-community-feed-live').on('postgres_changes',{event:'*',schema:'public',table:'profile_posts'},()=>loadPosts()).on('postgres_changes',{event:'*',schema:'public',table:'post_fire_reactions'},()=>loadPosts()).on('postgres_changes',{event:'INSERT',schema:'public',table:'post_comments'},()=>loadPosts()).subscribe();db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'||!s)location.replace('login.html')})}
async function loadPosts(){const box=$('feed');const {data:posts,error}=await db.from('profile_posts').select('id,user_id,body,image_url,created_at').order('created_at',{ascending:false}).limit(100);if(error){box.innerHTML=`<div class="empty error">Could not load community posts: ${esc(error.message)}. Check profile_posts permissions.</div>`;return}if(!posts?.length){box.innerHTML='<div class="empty">No posts yet. Be the first to share your fitness journey from your profile!</div>';return}const ids=[...new Set(posts.map(p=>p.user_id))],postIds=posts.map(p=>p.id);const [{data:people,error:pe},{data:likes,error:le},{data:comments,error:ce}]=await Promise.all([db.from('profiles').select('id,full_name,username,avatar_url').limit(1000),db.from('post_fire_reactions').select('post_id,user_id').in('post_id',postIds),db.from('post_comments').select('id,post_id,user_id,body,created_at').in('post_id',postIds).order('created_at',{ascending:true})]);if(pe||le||ce){box.innerHTML=`<div class="empty error">${esc((pe||le||ce).message)}. Run the included post engagement SQL.</div>`;return}profiles=new Map((people||[]).map(x=>[x.id,x]));const likeCounts=new Map(),liked=new Set(),commentGroups=new Map();(likes||[]).forEach(x=>{likeCounts.set(x.post_id,(likeCounts.get(x.post_id)||0)+1);if(x.user_id===user.id)liked.add(x.post_id)});(comments||[]).forEach(x=>{if(!commentGroups.has(x.post_id))commentGroups.set(x.post_id,[]);commentGroups.get(x.post_id).push(x)});
box.innerHTML=posts.map(p=>{const a=profiles.get(p.user_id)||{full_name:'REPSYNC Member'},cs=commentGroups.get(p.id)||[],count=likeCounts.get(p.id)||0;return `<article class="post" data-post="${esc(p.id)}"><div class="post-head">${avatar(a)}<div><a class="author author-link" href="friend-profile.html?id=${encodeURIComponent(p.user_id)}">${esc(a.full_name||a.username||'REPSYNC Member')}</a><div class="handle">${a.username?'@'+esc(a.username):'REPSYNC Member'}</div></div><time class="date">${new Date(p.created_at).toLocaleString()}</time></div>${p.body?`<p class="body">${esc(p.body)}</p>`:''}${p.image_url?`<img class="post-image" src="${esc(p.image_url)}" alt="Community post photo" loading="lazy">`:''}<div class="post-actions"><button type="button" class="fire-btn ${liked.has(p.id)?'active':''}" data-fire="${esc(p.id)}">🔥 <span>${count}</span></button><button type="button" class="comment-toggle" data-comments="${esc(p.id)}">Comment <span class="comment-count">${cs.length}</span></button></div><section class="comments" id="comments-${esc(p.id)}"><div class="comment-list">${cs.length?cs.map(c=>{const cp=profiles.get(c.user_id)||{full_name:'Member'};return `<div class="comment">${avatar(cp)}<div><strong>${esc(cp.full_name||cp.username||'Member')}</strong>${esc(c.body)}</div></div>`}).join(''):'<div class="comment-empty">No comments yet. Be the first!</div>'}</div><form class="comment-form" data-comment-form="${esc(p.id)}"><input maxlength="500" required placeholder="Write a comment…" aria-label="Write a comment"><button type="submit">Send</button></form></section></article>`}).join('')}
async function handleFeedClick(e){const target=e.target instanceof Element?e.target:e.target?.parentElement;if(!target)return;const fire=target.closest('button[data-fire]');if(fire){fire.disabled=true;const postId=fire.dataset.fire;const {data:existing,error}=await db.from('post_fire_reactions').select('post_id').eq('post_id',postId).eq('user_id',user.id).maybeSingle();if(error){alert(error.message);fire.disabled=false;return}const result=existing?await db.from('post_fire_reactions').delete().eq('post_id',postId).eq('user_id',user.id):await db.from('post_fire_reactions').insert({post_id:postId,user_id:user.id});if(result.error)alert(result.error.message);await loadPosts();return}const toggle=target.closest('button[data-comments]');if(toggle){$('comments-'+toggle.dataset.comments)?.classList.toggle('open')}}
$('feed').addEventListener('submit',async e=>{const form=e.target.closest('[data-comment-form]');if(!form)return;e.preventDefault();const input=form.querySelector('input'),body=input.value.trim();if(!body)return;const btn=form.querySelector('button');btn.disabled=true;const {error}=await db.from('post_comments').insert({post_id:form.dataset.commentForm,user_id:user.id,body});if(error)alert(error.message);else await loadPosts();btn.disabled=false});
async function logout(){const {error}=await db.auth.signOut();if(error){alert(error.message);return}location.replace('login.html')}load().catch(e=>{$('feed').innerHTML=`<div class="empty error">${esc(e.message)}</div>`});
})();
</script><nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a class="mobile-nav-link" href="dashboard.html"><span class="mobile-nav-icon">⌂</span><span>Dashboard</span></a><a class="mobile-nav-link" href="nutrition.html"><span class="mobile-nav-icon">◉</span><span>Nutrition</span></a><a class="mobile-nav-link" href="workout-logs.html"><span class="mobile-nav-icon">↗</span><span>Workouts</span></a><a class="mobile-nav-link active" href="muscle-targets.html"><span class="mobile-nav-icon">◎</span><span>Feed</span></a><a class="mobile-nav-link" href="friends.html"><span class="mobile-nav-icon">♧</span><span>Friends</span></a><a class="mobile-nav-link" href="my-profile.html"><span class="mobile-nav-icon">●</span><span>Profile</span></a></nav></body></html>
